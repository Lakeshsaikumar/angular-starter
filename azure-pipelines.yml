# Node.js with Angular
# Build a Node.js project that uses Angular.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript


# Angular 22 Build and ZIP Artifact

trigger:
  - master

pool:
  vmImage: 'ubuntu-latest'

steps:
  # 1. Install Node.js
  - task: UseNode@1
    displayName: 'Use Node.js 22'
    inputs:
      version: '22.x'

  # 2. Verify Node.js and npm
  - script: |
      node --version
      npm --version
    displayName: 'Check Node.js and npm'

  # 3. Install dependencies
  - script: npm ci
    displayName: 'Install npm dependencies'

  # 4. Build Angular application
  - script: npm run build
    displayName: 'Build Angular application'

  # 5. Find Angular browser output and create ZIP
  - script: |
      set -e

      echo "Searching for Angular index.html..."

      INDEX_FILE=$(find "$(Build.SourcesDirectory)/dist" -name index.html -type f -print -quit)

      if [ -z "$INDEX_FILE" ]; then
        echo "ERROR: Angular index.html not found!"
        exit 1
      fi

      BUILD_FOLDER=$(dirname "$INDEX_FILE")

      echo "Angular build folder: $BUILD_FOLDER"

      mkdir -p "$(Build.ArtifactStagingDirectory)/angular-app"

      cd "$BUILD_FOLDER"

      zip -r "$(Build.ArtifactStagingDirectory)/angular-app/angular-app.zip" .

      echo "Angular ZIP created successfully."
    displayName: 'Create Angular deployment ZIP'

  # 6. Publish ZIP artifact
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Angular ZIP artifact'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/angular-app'
      ArtifactName: 'angular-app'
      publishLocation: 'Container'
